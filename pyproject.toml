[project]
name = "py-app-tmpl"
version = "0.1.0"
description = "Reusable Python project starter"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Iuri Covaliov", email = "iu.covaliov@gmail.com" }
]
dependencies = [
    "fastapi[standard]>=0.162.4,<0.163.0",
    "gunicorn>=27.0.1,<27.1.0",
    "pydantic-settings>=2.16.2,<2.17.0",
    "uvicorn>=0.54.0,<0.55.0",
    "uvicorn-worker>=0.4.0,<0.5.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
py-app-tmpl = "py_app_tmpl.main:main"
py-app-api = "py_app_tmpl.api.main:main"

[project.optional-dependencies]
postgres = [
    "alembic>=1.20.1,<1.21.0",
    "asyncpg>=0.32.0,<0.33.0",
    "sqlmodel>=0.0.50,<0.0.51",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4,<1.10.0",
    "httpx2>=2.16.0,<2.17.0",
    "mypy>=2.4.1,<2.5.0",
    "pytest>=9.2.0,<9.3.0",
    "pytest-asyncio>=1.4.1.post1,<1.5.0",
    "pytest-cov>=7.1.0,<7.2.0",
    "ruff>=0.17.4,<0.18.0",
    "testcontainers[postgres]>=4.15.0,<4.16.0",
    "types-gunicorn>=26.2.0.20261008,<26.3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src/py_app_tmpl"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["py_app_tmpl"]

[tool.coverage.report]
show_missing = true
fail_under = 95
skip_empty = true

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src"]
files = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
