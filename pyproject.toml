[project]
name = "py-app-tmpl"
version = "0.1.0"
description = "Reusable Python project starter"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Iuri Covaliov", email = "iu.covaliov@gmail.com" }
]
dependencies = [
    "pydantic-settings>=2.16.2,<2.17.0",
]

[project.scripts]
py-app-tmpl = "py_app_tmpl.main:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4,<1.10.0",
    "mypy>=2.4.1,<2.5.0",
    "pytest>=9.2.0,<9.3.0",
    "pytest-cov>=7.1.0,<7.2.0",
    "ruff>=0.17.4,<0.18.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["py_app_tmpl"]

[tool.coverage.report]
show_missing = true
fail_under = 95
skip_empty = true

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["py_app_tmpl"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
